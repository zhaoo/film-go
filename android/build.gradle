allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Compatibility shim for older Flutter plugins that don't declare
// `android.namespace` (required by AGP 8+). Reads the legacy `package`
// attribute from the plugin's AndroidManifest.xml and applies it as namespace.
// Must be registered BEFORE the `evaluationDependsOn(":app")` block, otherwise
// subprojects are already evaluated by the time the hook is attached.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def parsed = new XmlParser().parse(manifestFile)
                    def pkg = parsed.attribute("package")
                    if (pkg != null) {
                        androidExt.namespace = pkg.toString()
                    }
                }
            }
            // 强制对齐 JVM target，防止 image_gallery_saver 等老插件
            // 出现 Kotlin(17) vs Java(1.8) target 冲突；同时把过老的
            // compileSdk 拉到 34（lStar 等 attr 在 31 后才存在）。
            if (androidExt != null) {
                androidExt.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                if (androidExt.hasProperty("compileSdkVersion") && androidExt.compileSdkVersion != null) {
                    def current = androidExt.compileSdkVersion.toString()
                    def num = (current =~ /\d+/).find { true }
                    if (num != null && num.toInteger() < 34) {
                        androidExt.compileSdkVersion 34
                    }
                }
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
